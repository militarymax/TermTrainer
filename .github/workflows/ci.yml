name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o termtrainer .

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version=${VERSION}" -o termtrainer-darwin-arm64 .
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o termtrainer-linux-amd64 .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            termtrainer-darwin-arm64
            termtrainer-linux-amd64
          generate_release_notes: true
